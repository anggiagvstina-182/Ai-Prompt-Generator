<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Template Creator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2 rounded-lg text-white"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">AI Prompt Creator</h1>
        </div>
        <button onclick="alert('Aplikasi ini aktif secara online dan siap digunakan atau dijual!')" class="text-xs bg-indigo-600 hover:bg-indigo-500 px-3 py-2 rounded-lg font-medium transition text-white">Info</button>
    </header>
    
    <main class="flex-grow container mx-auto p-4 md:p-6 max-w-4xl">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
            <h2 class="text-lg font-semibold text-indigo-300"><i class="fa-solid fa-pen-to-square mr-2"></i>Buat Prompt Otomatis</h2>
            
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Topik / Produk / Bisnis Anda</label>
                <input type="text" id="topicInput" placeholder="Contoh: Jasa Cuci Sepatu Kilat di Jakarta" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Pilih Kebutuhan</label>
                <select id="categoryInput" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500">
                    <option value="copywriting">Iklan & Copywriting Penjualan (IG/TikTok)</option>
                    <option value="content">Ide Konten / Jadwal Posting Sosmed</option>
                    <option value="seo">Artikel SEO / Deskripsi Produk Tokopedia</option>
                </select>
            </div>

            <button onclick="generatePrompt()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-3 rounded-lg transition shadow-lg shadow-indigo-600/30 text-white cursor-pointer">
                <i class="fa-solid fa-bolt mr-2"></i> Generate Prompt Sekarang
            </button>

            <div class="mt-4">
                <div class="flex justify-between items-center mb-1">
                    <label class="text-sm font-medium text-slate-300">Hasil Prompt AI:</label>
                    <button onclick="copyResult()" class="text-xs bg-slate-700 hover:bg-slate-600 text-indigo-300 px-2.5 py-1 rounded transition"><i class="fa-regular fa-copy mr-1"></i> Salin Teks</button>
                </div>
                <textarea id="outputResult" rows="6" readonly class="w-full bg-slate-900 border border-slate-700 rounded-lg p-4 text-slate-300 font-mono text-sm focus:outline-none" placeholder="Hasil prompt otomatis akan muncul di sini setelah Anda klik tombol di atas..."></textarea>
            </div>
        </div>
    </main>

    <script>
        function generatePrompt() {
            const topic = document.getElementById('topicInput').value.trim();
            const category = document.getElementById('categoryInput').value;
            
            if(!topic) {
                alert('Silakan isi topik atau produk terlebih dahulu!');
                return;
            }

            let resultText = "";
            if(category === 'copywriting') {
                resultText = `Bertindaklah sebagai Copywriter profesional berkonversi tinggi. Buatkan 3 variasi teks iklan/caption media sosial (Instagram & TikTok) yang persuasif, memancing emosi, dan dilengkapi Call-to-Action (CTA) untuk produk/jasa: "${topic}". Target audiens adalah masyarakat umum yang aktif berbelanja online.`;
            } else if(category === 'content') {
                resultText = `Bertindaklah sebagai Content Strategist. Buatkan roadmap atau ide konten mingguan (7 hari) yang menarik, edukatif, dan menghibur seputar "${topic}" untuk meningkatkan *engagement* dan pengikut di media sosial.`;
            } else {
                resultText = `Bertindaklah sebagai SEO Expert & E-commerce Copywriter. Buatkan draf deskripsi produk yang informatif, kaya kata kunci, dan profesional untuk "${topic}" agar mudah ditemukan di mesin pencari dan marketplace.`;
            }

            document.getElementById('outputResult').value = resultText;
        }

        function copyResult() {
            const outputBox = document.getElementById('outputResult');
            if(!outputBox.value) {
                alert('Belum ada teks untuk disalin!');
                return;
            }
            outputBox.select();
            navigator.clipboard.writeText(outputBox.value);
            alert('Prompt berhasil disalin ke clipboard!');
        }
    </script>
</body>
</html>
